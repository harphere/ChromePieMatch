plugins {
    id 'com.android.application' version '8.7.3'
}
repositories {
    google()
    mavenCentral()
    maven { url 'https://api.xposed.info/' }
}
android {
    namespace 'dev.chet.chromepiestatusmatch'
    compileSdk 35
    defaultConfig {
        applicationId 'dev.chet.chromepiestatusmatch'
        minSdk 16
        targetSdk 23
        versionCode 22
        versionName '0.7.5-statusmatch-test1'
    }
    lint { abortOnError false }
    sourceSets {
        main {
            manifest.srcFile 'AndroidManifest.xml'
            java.srcDirs = ['src']
            res.srcDirs = ['res']
            assets.srcDirs = ['assets']
        }
    }
}
dependencies {
    compileOnly 'de.robv.android.xposed:api:82'
    implementation 'org.apache.commons:commons-lang3:3.4'
}
